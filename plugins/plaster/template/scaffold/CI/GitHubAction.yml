# This is a basic workflow to help you get started with Actions

name: CICD-Build
run-name: Deploy Branch ${{ github.ref_name }} by ${{ github.actor }}

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches:
      - "master"
      - "main"
      - 'release/**'
    paths-ignore:
      - "*.psd1"
      - 'docs/**'
      - "**/*.md"
      - "appveyor.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Serialize builds per branch. Two runs on one branch race to `git tag -a
# "v$ManifestVersion"` (SystemUpdates.build.ps1), which is unguarded -- the loser dies
# with "fatal: tag 'vX' already exists" AFTER signing but BEFORE Upload to PSRepository,
# leaving a tag on origin with no package behind it, blocking every later build
# that computes the same version.
#
# cancel-in-progress is TRUE because a run whose branch has moved is already doomed: its
# final `git push --follow-tags` is rejected non-fast-forward AFTER signing but BEFORE
# "Upload to PSRepository", so it can never publish. Letting it finish only burns a runner
# and delays the run that can.
#
# Cancelling is safe for almost the whole build: `git tag -a` (SystemUpdates.build.ps1
# :1886) is runner-local, and a kill before the push at :1888 discards it with the VM.
# The one exposed window is between "Push Release info to github" finishing and "Upload to
# PSRepository" finishing -- seconds, during which the tag is on origin with no package
# behind it, which blocks every later build that computes that version. To close it
# entirely, upload to the feed BEFORE pushing the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NugetRepository: "${{ vars.NUGETREPOSITORY }}"
  NugetRepositorySourceLocation: "${{ vars.NUGETREPOSITORYSOURCELOCATION }}"
  NugetRepositoryPublishLocation: "${{ vars.NUGETREPOSITORYPUBLISHLOCATION }}"
  NugetRepositoryScriptSourceLocation: "${{ vars.NUGETREPOSITORYSCRIPTSOURCELOCATION }}"
  NugetRepositoryScriptPublishLocation: "${{ vars.NUGETREPOSITORYSCRIPTPUBLISHLOCATION }}"
  NugetAPIKey: ${{ secrets.NUGETAPIKEY }}
  GithubPAT: ${{ secrets.GITHUBPAT }}
  CODE_SIGN_PWD: ${{ secrets.CODE_SIGN_PWD }}
  OptionSignModule: ${{ vars.OPTIONSIGNMODULE }}
  OptionSignNuGetPackage: ${{ vars.OPTIONSIGNNUGETPACKAGE }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel

jobs:

  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - run: echo "Building ${{ github.repository }}/${{ github.ref_name }} by ${{ github.actor }} on ${{ runner.os }}"

      - name: Show PSVersion
        shell: powershell
        run: |
          $PSVersionTable
          "Built Using Powershell $($PSVersionTable.PSVersion)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check for NugetRepository
        shell: powershell
        run: |
          if (-not $env:NugetAPIKey) {
            Write-Warning "env:NugetAPIKey is not set"
            $Return = "WARNING env:NugetAPIKey is not set"
          } elseif ($env:NugetRepository) {
            $Return = "NugetRepository is '$($env:NugetRepository)' and NugetAPIKey is '$($env:NugetAPIKey.substring(0,4))***$($env:NugetAPIKey.substring($env:NugetAPIKey.length-4,4))'"
          } else {
            $Return = "NugetRepository is 'PSGallery' and NugetAPIKey is '$($env:NugetAPIKey.substring(0,4))***$($env:NugetAPIKey.substring($env:NugetAPIKey.length-4,4))'"
          }
          Write-Host $Return
          $Return | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check for GithubPAT
        shell: powershell
        run: |
          if ($env:GithubPAT) {
            $Return = "GithubPAT is '$($env:GithubPAT.substring(0,4))***$($env:GithubPAT.substring($env:GithubPAT.length-4,4))'"
          } else {
            $Return = "GithubPAT is null"
          }
          Write-Host $Return
          $Return | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      #
      # fetch-tags is REQUIRED, not an optimisation. DetectNewVersion picks the next
      # version as the max over five sources, one of which is `git tag -l`
      # (SystemUpdates.build.ps1:1546) -- and checkout's default fetches no tags, so that
      # source silently contributed NOTHING and version choice was effectively gallery-only.
      # A tag on origin whose package never published is then invisible when the version is
      # chosen, but arrives in the `git fetch` inside GithubPushVersionRelease, so the build
      # dies on `git tag -a ... already exists` AFTER signing and never publishes. That is
      # what blocked 0.3.13-beta on 2026-08-03.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Get Push Details
        shell: powershell
        run: |
          $env:github_push_title = git show --pretty=format:%s -s HEAD
          $env:github_author_name = git show --pretty=format:%an -s HEAD
          $env:github_author_email = git show --pretty=format:%ae -s HEAD
          "github_push_title=$env:github_push_title" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "github_author_name=$env:github_author_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "github_author_email=$env:github_author_email" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found title $env:github_push_title"

      - name: Update Summary with push title
        shell: powershell
        run: |
          $Return = "Running Build of push '$($env:github_push_title)' by $($env:github_author_name) on branch '$($env:GITHUB_REF_NAME)'."
          write-host $Return
          $Return | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Run Build Test of push '${{ env.github_push_title }}'
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          . .\Build.ps1 -Test

      - name: Register PSRepository '${{ env.NugetRepository }}'
        shell: powershell
        run: |
          if (-not $env:NugetRepository) {
            Write-output "No NugetRepository specified, using PSGallery" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } elseif ($env:NugetRepository -eq "PSGallery") {
            Write-output "Using PSGallery as NugetRepository" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Write-output "Using $env:NugetRepository as NugetRepository" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Register-PSRepository -Name $env:NugetRepository -InstallationPolicy "Trusted" -SourceLocation $env:NugetRepositorySourceLocation -PublishLocation $env:NugetRepositoryPublishLocation -ScriptSourceLocation $env:NugetRepositoryScriptSourceLocation -ScriptPublishLocation $env:NugetRepositoryScriptPublishLocation
          }

      - name: Update Release Version
        id: Update-ModuleVersion
        shell: powershell
        run: |
          $ReleaseType = ($env:github_ref_name).Split('/')[1]
          Write-Host "Using NugetRepository : '$env:NugetRepository'"
          Write-Host "  Setting ReleaseNotes: '$env:github_push_title'"
          Write-Host "  Setting ReleaseType : '$ReleaseType'"
          . .\Build.ps1 -UpdateRelease -AutoNewVersion -ReleaseNotes $env:github_push_title -ReleaseType $ReleaseType
          "ModuleVersion=$env:ModuleVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Build Version $env:ModuleVersion" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Import code-signing CA certificate
        shell: powershell
        env:
          CODE_SIGN_CA_BASE64: ${{ secrets.CODE_SIGN_CA_BASE64 }}
        run: |
          # Imports the issuing CA's PUBLIC certificate into the runner's trusted root store
          # so Set-AuthenticodeSignature can build a trusted chain when signing with an
          # internal/private CA. The secret contains a base64-encoded .cer/.crt/.p7b file
          # (no private key). Skip silently if not provided so builds that use publicly-trusted
          # certs (PSGallery, DigiCert, etc.) don't need this secret.
          if ($env:CODE_SIGN_CA_BASE64) {
            $caPath = Join-Path $env:RUNNER_TEMP 'codesign-ca.cer'
            [IO.File]::WriteAllBytes($caPath, [Convert]::FromBase64String($env:CODE_SIGN_CA_BASE64))
            Write-Host "Importing CA certificate from $caPath into Cert:\LocalMachine\Root"
            $imported = Import-Certificate -FilePath $caPath -CertStoreLocation Cert:\LocalMachine\Root
            $imported | Format-Table Thumbprint, Subject -AutoSize | Out-String | Write-Host
            "Imported $($imported.Count) CA certificate(s) into LocalMachine\Root" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Write-Host "CODE_SIGN_CA_BASE64 not set; skipping CA import. (Set this secret if Set-AuthenticodeSignature fails with 'A certificate chain could not be built to a trusted root authority'.)"
          }
        # secrets.CODE_SIGN_CA_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes('codesign-ca.cer')) from your CA's PUBLIC cert (no private key)

      - name: Decode code-signing certificate
        shell: powershell
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
        run: |
          if ($env:CODE_SIGN_PFX_BASE64) {
            Write-Host "Decoding code-signing certificate from CODE_SIGN_PFX_BASE64 environment variable"
            New-Item -Path .\build\signing -ItemType Directory -Force | Out-Null
            $pfxPath = '.\build\signing\codesign.pfx'
            Write-Host "Writing code-signing certificate to $pfxPath"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            "SigningCertificatePath=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning "CODE_SIGN_PFX_BASE64 not set; signing tasks will fail unless OptionSignModule/OptionSignNuGetPackage are off."
          }
        # secrets.CODE_SIGN_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes('codesign.pfx')) from your local PFX
      - name: BuildModule Version '${{ env.ModuleVersion }}'
        shell: powershell
        run: |
          Write-Host "Using NugetRepository: '$env:NugetRepository'"
          . .\Build.ps1 -BuildModule

      - name: Configure Git to push to GitHub
        shell: powershell
        run: |
          if ($env:GithubPAT) {
            git config --global credential.helper store
            Set-Content -Path "$HOME\.git-credentials" -Value "https://$($env:GithubPAT):x-oauth-basic@github.com`n" -NoNewline
          }
          git config --global user.name "$env:github_author_name"
          git config --global user.email "$env:github_author_email"
          git config --global --list | Where-Object {$_ -match 'user.*'}

      - name: Push Release info to github
        shell: powershell
        run: |
          . .\Build.ps1 -GithubPushVersionRelease

      - name: Upload to PSRepository
        shell: powershell
        run: |
          if ($env:NugetAPIKey) {
            . .\Build.ps1 -UploadPSGallery
          }
